<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B3A5B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#107C10"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1120" height="760" fill="#F8FAFC"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#0F172A">Secret Rotation Architecture</text>
  <text x="60" y="82" font-size="16" fill="#475569">Event-driven orchestration of non-human credential rotation &#183; Meridian Health Partners (HIPAA)</text>
  <line x1="60" y1="100" x2="1060" y2="100" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Key Vault -->
  <g filter="url(#shadow)">
    <rect x="70" y="250" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="70" y="250" width="230" height="8" rx="4" fill="#0078D4"/>
    <text x="90" y="290" font-size="17" font-weight="700" fill="#0F172A">Azure Key Vault</text>
    <text x="90" y="313" font-size="12.5" fill="#475569" font-family="monospace">kv-meridian-health-01</text>
    <text x="90" y="335" font-size="12.5" fill="#475569" font-family="monospace">secret: ehr-db-connection</text>
  </g>

  <!-- Event Grid -->
  <g filter="url(#shadow)">
    <rect x="450" y="140" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="450" y="140" width="220" height="8" rx="4" fill="#5C2D91"/>
    <text x="470" y="180" font-size="17" font-weight="700" fill="#0F172A">Azure Event Grid</text>
    <text x="470" y="203" font-size="12.5" fill="#475569">Event routing / pub-sub</text>
    <text x="470" y="223" font-size="12.5" fill="#475569">Near-expiry event source</text>
  </g>

  <!-- Azure Function -->
  <g filter="url(#shadow)">
    <rect x="820" y="250" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="820" y="250" width="230" height="8" rx="4" fill="#D83B01"/>
    <text x="840" y="290" font-size="17" font-weight="700" fill="#0F172A">Azure Function</text>
    <text x="840" y="313" font-size="12.5" fill="#475569">(or Automation runbook)</text>
    <text x="840" y="335" font-size="12.5" fill="#475569">Rotation orchestrator</text>
  </g>

  <!-- EHR SQL DB -->
  <g filter="url(#shadow)">
    <rect x="820" y="470" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="820" y="470" width="230" height="8" rx="4" fill="#107C10"/>
    <text x="840" y="510" font-size="17" font-weight="700" fill="#0F172A">EHR Database</text>
    <text x="840" y="533" font-size="12.5" fill="#475569" font-family="monospace">Meridian EHR (Azure SQL)</text>
    <text x="840" y="555" font-size="12.5" fill="#475569" font-family="monospace">account: ehr_app</text>
  </g>

  <!-- Application -->
  <g filter="url(#shadow)">
    <rect x="70" y="470" width="230" height="104" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="70" y="470" width="230" height="8" rx="4" fill="#334155"/>
    <text x="90" y="510" font-size="17" font-weight="700" fill="#0F172A">EHR Application</text>
    <text x="90" y="533" font-size="12.5" fill="#475569">Consumes secret at runtime</text>
    <text x="90" y="555" font-size="12.5" fill="#475569" font-family="monospace">RBAC: Key Vault Secrets User</text>
  </g>

  <!-- 1: KV -> Event Grid -->
  <path d="M 300 285 C 380 250, 400 210, 448 195" fill="none" stroke="#1B3A5B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="378" cy="232" r="15" fill="#0078D4"/>
  <text x="378" y="237" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="300" y="175" font-size="12.5" font-weight="600" fill="#1B3A5B">SecretNearExpiry</text>
  <text x="300" y="192" font-size="12.5" fill="#475569">event emitted</text>

  <!-- 2: Event Grid -> Function -->
  <path d="M 672 195 C 740 210, 770 245, 818 278" fill="none" stroke="#1B3A5B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="748" cy="232" r="15" fill="#0078D4"/>
  <text x="748" y="237" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="700" y="170" font-size="12.5" font-weight="600" fill="#1B3A5B">Routes event</text>
  <text x="700" y="187" font-size="12.5" fill="#475569">to subscriber</text>

  <!-- 3: Function -> DB -->
  <path d="M 935 356 L 935 468" fill="none" stroke="#1B3A5B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="935" cy="412" r="15" fill="#0078D4"/>
  <text x="935" y="417" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="958" y="405" font-size="12.5" font-weight="600" fill="#1B3A5B">Rotate credential</text>
  <text x="958" y="422" font-size="12.5" fill="#475569">in the EHR system</text>

  <!-- 4: Function -> KV (write-back) -->
  <path d="M 820 335 L 302 335" fill="none" stroke="#107C10" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
  <circle cx="561" cy="335" r="15" fill="#107C10"/>
  <text x="561" y="340" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="561" y="368" font-size="12.5" font-weight="600" fill="#107C10" text-anchor="middle">Write new secret version &#8594; Key Vault</text>

  <!-- 5: KV -> App -->
  <path d="M 185 356 L 185 468" fill="none" stroke="#1B3A5B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="185" cy="412" r="15" fill="#0078D4"/>
  <text x="185" y="417" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="208" y="405" font-size="12.5" font-weight="600" fill="#1B3A5B">App reads current</text>
  <text x="208" y="422" font-size="12.5" fill="#475569">version (transparent)</text>

  <!-- honest-wall callout -->
  <rect x="60" y="638" width="1000" height="86" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="60" y="638" width="7" height="86" rx="3.5" fill="#D83B01"/>
  <text x="86" y="668" font-size="15" font-weight="700" fill="#9A3412">Native vs. orchestrated &#8212; the enforcement boundary</text>
  <text x="86" y="692" font-size="13" fill="#7C2D12">Key Vault natively rotates KEYS (rotation policy) and renews CERTIFICATES (lifetime action). SECRETS have no native credential rotation:</text>
  <text x="86" y="712" font-size="13" fill="#7C2D12">the vault owns the stored object, not the downstream system that authenticates it &#8212; so credential rotation must be orchestrated, as shown above.</text>
</svg>
